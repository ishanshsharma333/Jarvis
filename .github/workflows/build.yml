name: Build Jarvis APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create the Jarvis project
        run: |
          D=jarvis/app/src/main
          mkdir -p $D/java/com/ishansh/jarvis $D/res/values $D/res/drawable $D/res/mipmap-anydpi-v26
          cp src/*.kt $D/java/com/ishansh/jarvis/
          cat > jarvis/settings.gradle.kts <<'JARVIS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Jarvis"
          include(":app")
          JARVIS_EOF
          cat > jarvis/build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          JARVIS_EOF
          cat > jarvis/gradle.properties <<'JARVIS_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          JARVIS_EOF
          cat > jarvis/app/build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ishansh.jarvis"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ishansh.jarvis"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          JARVIS_EOF
          cat > jarvis/app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Jarvis"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Jarvis">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".JarvisService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          JARVIS_EOF
          cat > jarvis/app/src/main/res/values/themes.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Jarvis" parent="Theme.AppCompat.NoActionBar" />
          </resources>
          JARVIS_EOF
          cat > jarvis/app/src/main/res/drawable/ic_launcher_background.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="54"
                          android:centerY="54"
                          android:gradientRadius="80">
                          <item android:offset="0" android:color="#FF24307A" />
                          <item android:offset="0.6" android:color="#FF0B1038" />
                          <item android:offset="1" android:color="#FF05060F" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          JARVIS_EOF
          cat > jarvis/app/src/main/res/drawable/ic_launcher_foreground.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M54,54m-32,0a32,32 0 1,0 64,0a32,32 0 1,0 -64,0">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="54"
                          android:centerY="54"
                          android:gradientRadius="32">
                          <item android:offset="0" android:color="#554DE3FF" />
                          <item android:offset="1" android:color="#004DE3FF" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M54.0,23.0 L80.8,38.5 L80.8,69.5 L54.0,85.0 L27.2,69.5 L27.2,38.5 Z"
                  android:strokeColor="#9B5CFF"
                  android:strokeWidth="1.4" />
              <path
                  android:pathData="M80.1,61.0A27,27 0 0,1 63.2,79.4"
                  android:strokeColor="#E5484D"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M47.0,80.1A27,27 0 0,1 28.6,63.2"
                  android:strokeColor="#E5484D"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M27.9,47.0A27,27 0 0,1 44.8,28.6"
                  android:strokeColor="#E5484D"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M61.0,27.9A27,27 0 0,1 79.4,44.8"
                  android:strokeColor="#E5484D"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M64.0,71.3A20,20 0 0,1 45.5,72.1"
                  android:strokeColor="#F5B301"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M36.7,64.0A20,20 0 0,1 35.9,45.5"
                  android:strokeColor="#F5B301"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M44.0,36.7A20,20 0 0,1 62.5,35.9"
                  android:strokeColor="#F5B301"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M71.3,44.0A20,20 0 0,1 72.1,62.5"
                  android:strokeColor="#F5B301"
                  android:strokeWidth="3.4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M51.7,66.8A13,13 0 0,1 42.2,59.5"
                  android:strokeColor="#4DE3FF"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M41.2,51.7A13,13 0 0,1 48.5,42.2"
                  android:strokeColor="#4DE3FF"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M56.3,41.2A13,13 0 0,1 65.8,48.5"
                  android:strokeColor="#4DE3FF"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M66.8,56.3A13,13 0 0,1 59.5,65.8"
                  android:strokeColor="#4DE3FF"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round" />
              <path android:pathData="M54,54m-7,0a7,7 0 1,0 14,0a7,7 0 1,0 -14,0">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="54"
                          android:centerY="54"
                          android:gradientRadius="7">
                          <item android:offset="0" android:color="#FFFFFFFF" />
                          <item android:offset="0.55" android:color="#FF4DE3FF" />
                          <item android:offset="1" android:color="#884DE3FF" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          JARVIS_EOF
          cat > jarvis/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          JARVIS_EOF
          cat > jarvis/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          JARVIS_EOF
      - name: Build the app
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon
      - name: Publish the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          name: Jarvis app ${{ github.run_number }}
          files: jarvis/app/build/outputs/apk/debug/app-debug.apk
